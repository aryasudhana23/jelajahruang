<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelajah Ruang</title>
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#1B2430; --muted:#58626F; --line:#DDE1E8;
  --u:#CF3D26; --u-soft:#FFE4DE; --u-ink:#FFFFFF;
  --a0:#087A7A; --a0s:#D6F2F1; --a1:#CF3D26; --a1s:#FFE4DE; --a2:#17814A; --a2s:#D8F3E2;
  --a3:#6B3FD0; --a3s:#E9E0FB; --a4:#C2255C; --a4s:#FCE0EA;
  --info:#E8A800; --info-bg:#FFF0B8; --ask:#1F78D1; --ask-bg:#D9EAFB;
  --good:#17814A; --good-bg:#DCF3E4; --bad:#C0392B; --bad-bg:#FCE3DD;
  --k0:#F0643C; --k1:#F5B820; --k2:#34B86B; --k3:#2FA0E0; --k4:#8A63E6; --k5:#E8508C;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Lexend','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161C; --surface:#1F232C; --ink:#EEF0F4; --muted:#A8B0BD; --line:#333A47;
  --u:#FF8D74; --u-soft:#4A2A22; --u-ink:#1A0E0B;
  --a0:#4FD0CF; --a0s:#143B3B; --a1:#FF8D74; --a1s:#4A2A22; --a2:#5ED68F; --a2s:#173D28;
  --a3:#B79CFF; --a3s:#33275B; --a4:#FF86B1; --a4s:#4D2236;
  --info:#E8B100; --info-bg:#4F4210; --ask:#5AA9F0; --ask-bg:#17395E;
  --good:#5CD68C; --good-bg:#163F29; --bad:#FF8A78; --bad-bg:#4A2019;
  --k0:#FF7A52; --k1:#FFC93A; --k2:#4ACB82; --k3:#4BB5F0; --k4:#A184F0; --k5:#F2679F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161C; --surface:#1F232C; --ink:#EEF0F4; --muted:#A8B0BD; --line:#333A47;
  --u:#FF8D74; --u-soft:#4A2A22; --u-ink:#1A0E0B;
  --a0:#4FD0CF; --a0s:#143B3B; --a1:#FF8D74; --a1s:#4A2A22; --a2:#5ED68F; --a2s:#173D28;
  --a3:#B79CFF; --a3s:#33275B; --a4:#FF86B1; --a4s:#4D2236;
  --info:#E8B100; --info-bg:#4F4210; --ask:#5AA9F0; --ask-bg:#17395E;
  --good:#5CD68C; --good-bg:#163F29; --bad:#FF8A78; --bad-bg:#4A2019;
  --k0:#FF7A52; --k1:#FFC93A; --k2:#4ACB82; --k3:#4BB5F0; --k4:#A184F0; --k5:#F2679F;
  color-scheme:dark}
/* Tiap unit punya warna sendiri: 0 hijau toska, 1 jingga merah, 2 hijau, 3 ungu, 4 merah muda */
.u0{--u:var(--a0);--u-soft:var(--a0s)} .u1{--u:var(--a1);--u-soft:var(--a1s)} .u2{--u:var(--a2);--u-soft:var(--a2s)}
.u3{--u:var(--a3);--u-soft:var(--a3s)} .u4{--u:var(--a4);--u-soft:var(--a4s)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-text-size-adjust:100%;
  padding-block:14px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ask);outline-offset:2px}
.app{max-width:480px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;align-items:center;gap:10px}
.logo{width:34px;display:block}
.brand{font:600 22px/1 var(--display);letter-spacing:.01em}
#view,.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:32px} h2{font-size:26px}
p{margin:0}
.lead{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.good{background:var(--good-bg);border-color:var(--good)}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.blk{display:block;width:100%;max-height:250px}
.blk .k0{--c:var(--k0)} .blk .k1{--c:var(--k1)} .blk .k2{--c:var(--k2)} .blk .k3{--c:var(--k3)} .blk .k4{--c:var(--k4)} .blk .k5{--c:var(--k5)}
.blk .top{fill:color-mix(in srgb,var(--c),#fff 32%)} .blk .lft{fill:var(--c)} .blk .rgt{fill:color-mix(in srgb,var(--c),#000 28%)}
.blk polygon{stroke:color-mix(in srgb,var(--c,#888),#000 45%);stroke-width:.6;stroke-linejoin:round}
.blk .floor{fill:none;stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1}
.logo .blk{max-height:none}
.between{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--u);border-radius:6px;transition:width .3s}
.bar.thin{height:6px}
.btn{min-height:52px;padding:12px 20px;border:0;border-radius:14px;background:var(--u);color:var(--u-ink);font-weight:600;font-size:17px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--u);box-shadow:inset 0 0 0 2px var(--u)}
.btn.big{width:100%;min-height:58px;font-size:18px}
.link{background:none;border:0;color:var(--u);font-weight:600;padding:8px 0;min-height:44px}
.navrow{display:flex;gap:10px}
.navrow .btn{flex:1}
input,textarea{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
label{font-weight:500}
/* menu bawah */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.navin{max-width:480px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.navin button{min-height:56px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:500}
.navin button[aria-current="page"]{background:var(--u-soft);color:var(--u);font-weight:600}
.navin svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* kartu unit */
.ucard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:72px}
.un{width:40px;height:40px;border-radius:12px;background:var(--u-soft);color:var(--u);display:grid;place-items:center;font:600 20px var(--display)}
.ut{display:flex;flex-direction:column;min-width:0}
.ut small{color:var(--muted);font-size:14px;line-height:1.3}
.us{font-size:14px;font-weight:600;color:var(--u)}
.us.ok{color:var(--good)}
.banner{background:var(--good-bg);border:1px solid var(--good);border-radius:14px;padding:12px 14px;font-weight:500}
/* belajar */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg i{height:6px;border-radius:3px;background:var(--line)}
.seg i.on{background:var(--u)} .seg i.cur{background:var(--ask)}
.goal{border-left:0;background:var(--u-soft);border-radius:14px;padding:12px 14px}
.qtext{font-size:19px;line-height:1.5;font-weight:500}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.hearts{display:inline-flex;gap:2px}
.h-on{fill:var(--bad);stroke:var(--bad)} .h-off{fill:none;stroke:var(--muted);stroke-width:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:54px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-weight:500;font-size:18px;text-align:left;padding:12px 16px}
.opt.sel{border-color:var(--u);background:var(--u-soft)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{color:var(--ink)}
.numf{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numf input{flex:1 1 120px;width:auto;font-size:20px;font-weight:600}
.fb{border-radius:14px;padding:12px 14px}
.fb.good{background:var(--good-bg);border:1px solid var(--good)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb.hint{background:var(--info-bg);border:1px solid var(--info)}
.hl-info{background:var(--info-bg);box-shadow:inset 0 -3px 0 var(--info);border-radius:4px;padding:0 3px}
.hl-ask{background:var(--ask-bg);box-shadow:inset 0 -3px 0 var(--ask);border-radius:4px;padding:0 3px}
.big{font-size:20px}
.num{font:600 22px var(--display)}
.step{display:grid;grid-template-columns:1fr auto 44px auto;gap:10px;align-items:center}
.rb{width:48px;height:48px;border-radius:50%;border:2px solid var(--u);background:var(--surface);color:var(--u);font-size:26px;font-weight:600;line-height:1}
.rb:disabled{opacity:.35}
.step output{font:600 24px var(--display);text-align:center}
.pop{animation:pop .4s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tank{display:block;width:100%;max-height:230px}
.tank .tw{fill:var(--surface);stroke:none}
.tank .water{fill:var(--ask);opacity:.6;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--lvl,0));transition:transform 1.4s ease}
.tank .tf{fill:none;stroke:var(--ink);stroke-width:3}
.tank .gl{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}
.tank text{fill:var(--ink);font:600 11px var(--body)}
.chunks{display:flex;flex-wrap:wrap;gap:8px}
.chunk{min-height:46px;padding:8px 12px;border:2px dashed var(--line);border-radius:12px;background:var(--surface);text-align:left;font-size:17px}
.chunk.m-info{border:2px solid var(--info);background:var(--info-bg)}
.chunk.m-ask{border:2px solid var(--ask);background:var(--ask-bg)}
.chunk.bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.chunk small{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mode{display:flex;align-items:center;gap:8px;min-height:50px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;font-weight:500;text-align:left}
.mode[aria-pressed="true"]{border-color:var(--u);background:var(--u-soft)}
.sw{width:18px;height:18px;border-radius:5px;flex:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid .opt{text-align:center;padding-inline:8px}
.srow{display:flex;justify-content:space-between;gap:10px;padding-block:8px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.score{font:600 56px/1 var(--display);color:var(--u)}
.tbl{display:flex;flex-direction:column}
.tbl div{display:flex;justify-content:space-between;gap:10px;padding-block:8px;border-bottom:1px solid var(--line)}
.tbl div:last-child{border-bottom:0}
.formula{font:600 22px/1.3 var(--display)}
.tm{display:flex;flex-direction:column;gap:4px;font-weight:600}
.cap{color:var(--muted);font-size:15px}
h2{color:var(--u)}
.hero{background:var(--u-soft);border-color:transparent}
.ubar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ubar i{height:14px;border-radius:7px;background:var(--line)}
.ubar i.on{background:var(--u)}
.il text{font:600 12px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.il text.q{fill:var(--bad);font-size:16px}
.il .ig-back{fill:var(--surface);fill-opacity:.55;stroke:var(--muted);stroke-width:1}
.il .ig-floor{fill:var(--line);stroke:var(--muted);stroke-width:1}
.il .ig-front{fill:var(--ask);fill-opacity:.1;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.il .ig-rim{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.il .iw-l{fill:var(--ask);fill-opacity:.72;stroke:none}
.il .iw-r{fill:color-mix(in srgb,var(--ask),#000 22%);fill-opacity:.78;stroke:none}
.il .iw-t{fill:color-mix(in srgb,var(--ask),#fff 38%);fill-opacity:.92;stroke:none}
.il .tape{fill:#fff;fill-opacity:.4;stroke:none}
.il .rib{fill:var(--info);stroke:color-mix(in srgb,var(--info),#000 40%);stroke-width:.8}
.il .bk-b{fill:var(--k3);stroke:color-mix(in srgb,var(--k3),#000 45%);stroke-width:1}
.il .bk-r{fill:color-mix(in srgb,var(--k3),#000 35%);stroke:none}
.il .bk-h{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.il .gl-cap{fill:var(--k4);stroke:none}
.il .gl-body{fill:var(--surface);fill-opacity:.6;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.il .gl-water{fill:var(--ask);fill-opacity:.65;stroke:none}
.tank .tfish{opacity:clamp(0,calc(var(--lvl,0)*2),1);transition:opacity 1.4s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr"><span class="logo" id="logo"></span><span class="brand">Jelajah Ruang</span></header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Menu utama"><div class="navin" id="nav">
  <button data-tab="beranda" class="u1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Beranda</button>
  <button data-tab="belajar" class="u0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-1.5-1.5-4-2-8-2v14c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2V4c-4 0-6.5.5-8 2zM12 6v14"/></svg>Belajar</button>
  <button data-tab="latihan" class="u3"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg>Latihan</button>
  <button data-tab="skor" class="u4"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Skor</button>
</div></nav>

<script>
(function(){
const $=(s,el)=>(el||document).querySelector(s);
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
const parseNum=v=>{const s=String(v).replace(/[.\s]/g,'').replace(',','.');return s===''||isNaN(Number(s))?NaN:Number(s)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- penyimpanan di HP siswa ---------- */
const KEY='jelajah-ruang-v1';
let S={name:'',done:{},scores:{},refl:{},notes:{},pos:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- gambar balok dari kubus satuan ---------- */
function drawBlock(p,l,t,o){
  o=o||{};
  const s=22,w=s*0.866,hh=s*0.5;
  const L=(i,j,k)=>[(i-j)*w,(i+j)*hh-k*s];
  const pt=a=>a[0].toFixed(1)+','+a[1].toFixed(1);
  const poly=(pts,c)=>'<polygon class="'+c+'" points="'+pts.map(pt).join(' ')+'"/>';
  const tf=o.tFull||t, minX=-l*w-3, maxX=p*w+3, minY=-Math.max(tf,1)*s-3, maxY=(p+l)*hh+3;
  let out='';
  if(o.floor)out+=poly([L(0,0,0),L(p,0,0),L(p,l,0),L(0,l,0)],'floor');
  const cubes=[];
  for(let k=0;k<t;k++)for(let i=0;i<p;i++)for(let j=0;j<l;j++)cubes.push([i,j,k]);
  cubes.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));
  cubes.forEach(c=>{const i=c[0],j=c[1],k=c[2];
    out+=poly([L(i,j,k+1),L(i+1,j,k+1),L(i+1,j+1,k+1),L(i,j+1,k+1)],'top k'+(k%6));
    out+=poly([L(i,j+1,k+1),L(i+1,j+1,k+1),L(i+1,j+1,k),L(i,j+1,k)],'lft k'+(k%6));
    out+=poly([L(i+1,j,k+1),L(i+1,j+1,k+1),L(i+1,j+1,k),L(i+1,j,k)],'rgt k'+(k%6));
  });
  return '<svg class="blk" viewBox="'+minX.toFixed(1)+' '+minY.toFixed(1)+' '+(maxX-minX).toFixed(1)+' '+(maxY-minY).toFixed(1)+'" role="img" aria-label="Balok dari '+(p*l*t)+' kotak kecil ('+p+' kali '+l+' kali '+t+')">'+out+'</svg>';
}
function tank(lvl,labels){
  return '<svg class="tank" id="tk" style="--lvl:'+lvl+'" viewBox="0 0 240 150" role="img" aria-label="Akuarium berisi air tiga perempat bagian">'+
  '<rect class="tw" x="30" y="20" width="160" height="110"/><rect class="water" x="30" y="20" width="160" height="110"/>'+
  '<g class="tfish"><polygon points="82,88 72,81 72,95" style="fill:var(--k0)"/><ellipse cx="95" cy="88" rx="11" ry="6.5" style="fill:var(--k1)"/><circle cx="101" cy="86" r="1.6" style="fill:var(--ink)"/>'+
  '<polygon points="158,106 168,99 168,113" style="fill:var(--k0)"/><ellipse cx="147" cy="106" rx="9" ry="5.5" style="fill:var(--k2)"/><circle cx="142" cy="104.5" r="1.4" style="fill:var(--ink)"/></g>'+
  '<rect class="tf" x="30" y="20" width="160" height="110" rx="3"/>'+
  (labels?'<line class="gl" x1="30" y1="20" x2="196" y2="20"/><line class="gl" x1="30" y1="47.5" x2="196" y2="47.5"/><text x="200" y="24">72 L</text><text x="200" y="51">54 L</text>':'')+
  '<text x="110" y="145">60 cm</text></svg>';
}

/* ---------- gambar ilustrasi soal ---------- */
function iso(ox,oy){
  const P=(x,y,z)=>[ox+(x-y)*0.866,oy+(x+y)*0.5-z];
  const poly=(arr,cls)=>'<polygon class="'+cls+'" points="'+arr.map(q=>{const r=P(q[0],q[1],q[2]);return r[0].toFixed(1)+','+r[1].toFixed(1)}).join(' ')+'"/>';
  return {P:P,poly:poly};
}
function fishSVG(cx,cy,sc){
  return '<g transform="translate('+cx.toFixed(1)+' '+cy.toFixed(1)+') scale('+sc.toFixed(2)+')"><polygon points="-9,0 -21,-8 -21,8" style="fill:var(--k0);stroke:none"/><ellipse rx="12" ry="7" style="fill:var(--k1);stroke:none"/><circle cx="6" cy="-1.5" r="1.8" style="fill:var(--ink);stroke:none"/></g>';
}
function bucketSVG(x,y,label){
  return '<path class="bk-h" d="M'+(x-21)+' '+(y-50)+' Q'+x+' '+(y-88)+' '+(x+21)+' '+(y-50)+'"/>'+
   '<path class="bk-b" d="M'+(x-27)+' '+(y-52)+' L'+(x+27)+' '+(y-52)+' L'+(x+20)+' '+y+' L'+(x-20)+' '+y+' Z"/>'+
   '<ellipse class="bk-r" cx="'+x+'" cy="'+(y-52)+'" rx="27" ry="6"/>'+
   '<text x="'+x+'" y="'+(y+17)+'" text-anchor="middle">'+label+'</text>';
}
function galonSVG(o){
  return '<svg class="blk il" viewBox="0 0 300 190" role="img" aria-label="Galon berisi air">'+
   '<rect class="gl-cap" x="128" y="22" width="44" height="14" rx="4"/>'+

function illus(o){
  if(o.kind==='galon')return galonSVG(o);
  const p=o.p,l=o.l,t=o.t,side=!!(o.bucket||o.mini);
  const aw=side?170:240,ah=120,left=side?8:30;
  const k=Math.min(aw/((p+l)*0.866),ah/(t+(p+l)*0.5));
  const a=p*k,b=l*k,c=t*k,bw=(a+b)*0.866,bh=c+(a+b)*0.5;
  const ox=left+(aw-bw)/2+b*0.866,oy=22+(ah-bh)/2+c;
  const I=iso(ox,oy),P=I.P,poly=I.poly;
  let g='';
  if(o.kind==='glass'){
    const f=o.water||0,h=c*f;
    g+=poly([[0,0,0],[0,b,0],[0,b,c],[0,0,c]],'ig-back')+poly([[0,0,0],[a,0,0],[a,0,c],[0,0,c]],'ig-back')+poly([[0,0,0],[a,0,0],[a,b,0],[0,b,0]],'ig-floor');
    if(f>0){
      g+=poly([[0,b,0],[a,b,0],[a,b,h],[0,b,h]],'iw-l')+poly([[a,0,0],[a,b,0],[a,b,h],[a,0,h]],'iw-r')+poly([[0,0,h],[a,0,h],[a,b,h],[0,b,h]],'iw-t');
      if(o.deco==='fish'&&f>=.4){const sc=Math.max(.7,Math.min(1.6,h/40)),f1=P(a*.55,b*.5,h*.5),f2=P(a*.25,b*.7,h*.3);g+=fishSVG(f1[0],f1[1],sc)+fishSVG(f2[0],f2[1],sc*.75)}
    }
    g+=poly([[0,b,0],[a,b,0],[a,b,c],[0,b,c]],'ig-front')+poly([[a,0,0],[a,b,0],[a,b,c],[a,0,c]],'ig-front')+poly([[0,0,c],[a,0,c],[a,b,c],[0,b,c]],'ig-rim');
  }else{
    const cc=o.color||'k1',d=o.deco;
    g+=poly([[0,0,c],[a,0,c],[a,b,c],[0,b,c]],'top '+cc)+poly([[0,b,0],[a,b,0],[a,b,c],[0,b,c]],'lft '+cc)+poly([[a,0,0],[a,b,0],[a,b,c],[a,0,c]],'rgt '+cc);
    if(d==='tape')g+=poly([[a*.42,0,c],[a*.58,0,c],[a*.58,b,c],[a*.42,b,c]],'tape')+poly([[a*.42,b,c],[a*.58,b,c],[a*.58,b,c*.55],[a*.42,b,c*.55]],'tape');
    if(d==='lid')g+=poly([[0,b,c],[a,b,c],[a,b,c*.78],[0,b,c*.78]],'tape')+poly([[a,0,c],[a,b,c],[a,b,c*.78],[a,0,c*.78]],'tape');
    if(d==='ribbon'){
      g+=poly([[0,b*.42,c],[a,b*.42,c],[a,b*.58,c],[0,b*.58,c]],'rib')+poly([[a,b*.42,c],[a,b*.58,c],[a,b*.58,0],[a,b*.42,0]],'rib');
      g+=poly([[a*.42,0,c],[a*.58,0,c],[a*.58,b,c],[a*.42,b,c]],'rib')+poly([[a*.42,b,c],[a*.58,b,c],[a*.58,b,0],[a*.42,b,0]],'rib');
      const m=P(a/2,b/2,c);g+='<circle class="rib" cx="'+m[0].toFixed(1)+'" cy="'+(m[1]-3).toFixed(1)+'" r="5"/>';
    }
    if(d==='pencils')[['k0',.3,-6],['k2',.5,0],['k3',.7,6]].forEach(z=>{const m=P(a*z[1],b*.5,c);g+='<line x1="'+m[0].toFixed(1)+'" y1="'+(m[1]+2).toFixed(1)+'" x2="'+(m[0]+z[2]).toFixed(1)+'" y2="'+(m[1]-30).toFixed(1)+'" style="stroke:var(--'+z[0]+');stroke-width:5;stroke-linecap:round"/>'});
  }
  const lab=o.lab||{};
  const T=(x,y,s,an)=>'<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+an+'"'+(s==='?'?' class="q"':'')+'>'+s+'</text>';
  if(lab.p){const m=P(a/2,b,0);g+=T(m[0]-10,m[1]+18,lab.p,'middle')}
  if(lab.l){const m=P(a,b/2,0);g+=T(m[0]+10,m[1]+18,lab.l,'middle')}
  if(lab.t){const m=P(a,0,c/2);g+=T(m[0]+9,m[1]+4,lab.t,'start')}
  if(o.bucket)g+=bucketSVG(262,126,o.bucket);
  if(o.mini){const J=iso(262,92),q=22;
    g+=J.poly([[0,0,q],[q,0,q],[q,q,q],[0,q,q]],'top k3')+J.poly([[0,q,0],[q,q,0],[q,q,q],[0,q,q]],'lft k3')+J.poly([[q,0,0],[q,q,0],[q,q,q],[q,0,q]],'rgt k3')+T(262,131,o.mini,'middle')+T(262,62,'kotak kecil','middle');}
  return '<svg class="blk il" viewBox="0 0 300 190" role="img" aria-label="'+(o.alt||'Gambar soal')+'">'+g+'</svg>';
}

function runQuiz(root,cfg){
  const qs=cfg.qs,n=qs.length,game=!!cfg.game,label=cfg.label||'Soal';
  let i=0,pts=0,hits=0,tries=0,hearts_=3,done=false,opts=[];
  function show(){
    clearInterval(timer);
    const q=qs[i];tries=0;done=false;opts=q.opts?shuffle(q.opts):[];
    root.innerHTML=
    '<div class="qhead"><span>'+label+' '+(i+1)+' dari '+n+'</span>'+(game?'<span id="hs">'+hearts(hearts_)+'</span><span>Skor '+hits*20+'</span>':'')+'</div>'+
    '<div class="bar"><i style="width:'+(i/n*100)+'%"></i></div>'+
    (game?'<div class="tm"><span><span id="tl">'+q.time+'</span> detik</span><div class="bar thin"><i id="tb" style="width:100%"></i></div></div>':'')+
    (q.block?'<div class="fig">'+drawBlock(q.block[0],q.block[1],q.block[2])+'</div>':'')+(q.pic?picHTML(q.pic):'')+
    '<p class="qtext">'+q.t+'</p>'+
    (q.opts?'<div class="opts" id="ans">'+opts.map((o,k)=>'<button class="opt" data-i="'+k+'">'+o+'</button>').join('')+'</div>'
      :'<form id="f" class="numf"><input id="inp" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Tulis jawabanmu dengan angka"><span>'+(q.u||'')+'</span><button class="btn" type="submit">Periksa</button></form>')+
    '<div id="fb" aria-live="polite"></div>';
    if(q.opts)$('#ans',root).onclick=e=>{const b=e.target.closest('.opt');if(b&&!b.disabled)judge(opts[+b.dataset.i],b)};
    else{$('#f',root).onsubmit=e=>{e.preventDefault();judge($('#inp',root).value)};setTimeout(()=>{const x=$('#inp',root);if(x)x.focus()},60)}
    if(game){let t=q.time;timer=setInterval(()=>{t--;const a=$('#tl',root),b=$('#tb',root);if(a)a.textContent=Math.max(t,0);if(b)b.style.width=Math.max(t,0)/q.time*100+'%';if(t<=0){clearInterval(timer);end(false,null,true)}},1000)}
  }
  function judge(v,btn){
    if(done)return;
    const q=qs[i];let ok;
    if(q.opts)ok=v===q.a;
    else{if(String(v).trim()===''){$('#fb',root).innerHTML='<div class="fb hint">Tulis jawabanmu dulu, ya.</div>';return}ok=parseNum(v)===q.a}
    if(ok)return end(true,btn);
    if(!game&&tries===0){
      tries=1;if(btn){btn.disabled=true;btn.classList.add('no')}
      $('#fb',root).innerHTML='<div class="fb hint"><b>Belum tepat.</b> Petunjuk: '+q.h+' Coba lagi.</div>';
      if(!q.opts){const x=$('#inp',root);x.select()}
      return;
    }
    end(false,btn);
  }
  function end(ok,btn,timeout){
    if(done)return;done=true;clearInterval(timer);
    const q=qs[i];
    if(ok){hits++;pts+=tries===0?1:.5}else if(game){hearts_--;const h=$('#hs',root);if(h)h.innerHTML=hearts(hearts_)}
    root.querySelectorAll('.opt,#inp,#f button').forEach(x=>x.disabled=true);
    if(q.opts)root.querySelectorAll('.opt').forEach((b,k)=>{if(opts[k]===q.a)b.classList.add('ok');else if(b===btn)b.classList.add('no')});
    const ans=q.opts?q.a:fmt(q.a)+(q.u?' '+q.u:'');
    $('#fb',root).innerHTML=ok?'<div class="fb good"><b>Benar!</b> '+q.e+'</div>':'<div class="fb bad"><b>'+(timeout?'Waktu habis.':'Belum tepat.')+'</b> Jawabannya '+ans+'. '+q.e+'</div>';
    const last=i===n-1||(game&&hearts_===0);
    const nb=document.createElement('button');nb.className='btn';nb.textContent=last?'Lihat hasil':(label==='Soal'?'Soal berikutnya':'Lanjut');
    nb.onclick=()=>{if(last)cfg.onDone({pts:game?hits:pts,n:n,hearts:hearts_,hits:hits});else{i++;show()}};
    root.appendChild(nb);
    nb.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  show();
}
function quizCfg(uid){return{qs:Q[uid],game:uid===4}}
function finishQuiz(uid,res,root,o){
  const nilai=Math.round(res.pts/res.n*100);
  S.scores[uid]=Math.max(S.scores[uid]!=null?S.scores[uid]:0,nilai);save();
  let msg;
  if(uid===0)msg=nilai>=80?'Kamu siap belajar Unit 1.':'Tidak apa-apa. Belajar Unit 1 pelan-pelan, ya.';
  else msg=nilai>=70?'Hebat! Kamu sudah paham bagian ini.':'Ayo ulangi langkah Jelajahi dan Pahami, lalu coba lagi.';
  if(uid===4&&res.hearts===0)msg='Nyawamu habis, jadi misi berhenti. '+msg;
  root.innerHTML='<div class="card"><p class="eyebrow">Nilaimu</p><p class="score">'+nilai+'</p><p>'+msg+'</p></div>'+
    (uid===4?followUp(nilai):'')+'<button class="btn ghost" id="again">Coba lagi</button>';
  $('#again',root).onclick=o.again;
  o.after();
}

}

function tandai(x){
  const parts=[
   {t:'Ibu membeli pia untuk oleh-oleh. Kardusnya berbentuk balok.',a:null},{t:'Panjangnya 50 cm,',a:'info'},{t:'lebarnya 30 cm,',a:'info'},{t:'dan tingginya 20 cm.',a:'info'},
   {t:'Pia itu enak sekali.',a:null},{t:'Berapa cm³ volume kardus itu?',a:'ask'}];

    '<div class="card"><div class="chunks">'+parts.map((p,i)=>'<button class="chunk'+(mark[i]?' m-'+mark[i]:'')+(checked&&mark[i]!==p.a?' bad':'')+'" data-i="'+i+'"'+(checked?' disabled':'')+'>'+(mark[i]?'<small>'+tag[mark[i]]+'</small>':'')+p.t+'</button>').join('')+'</div></div>'+
    (checked?(wrong===0?'<div class="fb good"><b>Hebat!</b> Semua tandamu tepat. Kalimat tentang pia tidak perlu dihitung.</div>':'<div class="fb hint"><b>Hampir.</b> Periksa bagian yang berbingkai merah. Cari angka ukuran dan kalimat tanya.</div><button class="btn ghost" id="rt">Coba lagi</button>'):'<button class="btn" id="ck">Periksa</button>');
    x.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
    x.querySelectorAll('.chunk').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;mark[i]=mark[i]===mode?null:mode;draw()});
    const ck=$('#ck',x);if(ck)ck.onclick=()=>{checked=true;draw()};
    const rt=$('#rt',x);if(rt)rt.onclick=()=>{checked=false;mark=parts.map(()=>null);draw()};

function matchGame(x){
  const pairs=[['2 liter','2.000 cm³'],['1 m³','1.000 liter'],['5 dm³','5 liter'],['3.000 cm³','3 liter']];
  const Lf=shuffle(pairs.map((p,i)=>({t:p[0],i:i}))),Rt=shuffle(pairs.map((p,i)=>({t:p[1],i:i})));
  let sel=null,found={},miss=0,msg='';
  function draw(){
    const n=Object.keys(found).length,fin=n===pairs.length;
    x.innerHTML='<p>Pasangkan ukuran yang nilainya sama. Ketuk satu kartu di kiri, lalu kartu pasangannya di kanan.</p>'+
    '<div class="mgrid"><div class="opts">'+Lf.map(c=>'<button class="opt'+(found[c.i]?' ok':'')+(sel===c.i?' sel':'')+'" data-s="L" data-i="'+c.i+'"'+(found[c.i]?' disabled':'')+'>'+c.t+'</button>').join('')+'</div>'+
    '<div class="opts">'+Rt.map(c=>'<button class="opt'+(found[c.i]?' ok':'')+'" data-s="R" data-i="'+c.i+'"'+(found[c.i]?' disabled':'')+'>'+c.t+'</button>').join('')+'</div></div>'+
    '<div aria-live="polite">'+(fin?'<div class="fb good"><b>Semua pasangan ketemu!</b> Salah '+miss+' kali.</div>':(msg?'<div class="fb hint">'+msg+'</div>':''))+'</div>';
    x.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(b.dataset.s==='L'){sel=i;msg='';draw();return}
      if(sel===null){msg='Pilih kartu di kiri dulu.';draw();return}
      if(sel===i){found[i]=true;sel=null;msg=''}else{miss++;sel=null;msg='Belum cocok. Ingat: 1 liter = 1.000 cm³ = 1 dm³. Coba lagi.'}
      draw();
    });
    if(fin)navBtns(x);
  }
  draw();
}

 },
 tandai(u,r){tandai(sub(r))},
 coba(u,r){
  const x=sub(r);
  const start=()=>runQuiz(x,Object.assign(quizCfg(u.id),{onDone:res=>finishQuiz(u.id,res,x,{again:start,after:()=>navBtns(x)})}));
  start();
 },
 tantang(u,r){
  const x=sub(r);
  if(u.id===2){matchGame(x);return}
  runQuiz(x,{qs:[TANTANG[u.id]],label:'Tantangan',onDone:res=>{
    x.innerHTML='<div class="card"><b>Tantangan selesai.</b><p>'+(res.pts>0?'Kamu berhasil menjawab tantangan ini.':'Tidak apa-apa. Kamu bisa mencobanya lagi nanti.')+'</p></div>';
    navBtns(x);
  }});
 },
 refleksi(u,r){
  const ops=['Sudah paham','Mulai paham','Belum paham'];
  r.innerHTML='<p class="qtext">Apa yang sudah kamu pahami?</p><div class="opts" id="rf">'+ops.map((o,i)=>'<button class="opt'+(S.refl[u.id]===i?' sel':'')+'" data-i="'+i+'" aria-pressed="'+(S.refl[u.id]===i)+'">'+o+'</button>').join('')+'</div>'+
   (u.id===3?'<div class="card"><label for="note">Teman Diskusi: tulis satu kalimat tentang alasan jawabanmu.</label><textarea id="note" rows="3" maxlength="200">'+esc(S.notes[3]||'')+'</textarea></div><div class="card"><b>Tugas di rumah</b><p>Buat satu soal cerita volume dari benda di rumahmu, misalnya kotak sepatu. Bawa ke kelas untuk dibahas bersama teman.</p></div>':'')+
   (u.id===4&&S.scores[4]!=null?followUp(S.scores[4]):'');
  $('#rf',r).onclick=e=>{const b=e.target.closest('.opt');if(!b)return;S.refl[u.id]=+b.dataset.i;save();r.querySelectorAll('#rf .opt').forEach(o=>{const on=+o.dataset.i===S.refl[u.id];o.classList.toggle('sel',on);o.setAttribute('aria-pressed',on)})};
  const nt=$('#note',r);if(nt)nt.oninput=()=>{S.notes[3]=nt.value;save()};
  navBtns(r);
 }
};

render();
})();
</script>
</body>
</html>
